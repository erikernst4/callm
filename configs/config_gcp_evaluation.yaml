# Config for correctness evaluation using Google Cloud LLMs (Gemini).
# Supports incremental evaluation: skips API calls for exact matches and
# samples already evaluated in previous_eval_csv.
seed_everything: true
trainer:
  evaluate_correctness: false
  evaluator_model_name: "gemini-3-flash-preview"
  evaluator_batch_size: 10
  accelerator: "cpu"
  strategy: auto
  devices: 1
  num_nodes: 1
  deterministic: null
  inference_mode: true
  use_distributed_sampler: true
  default_root_dir: null

model:
  class_path: callm.models.GCPEvaluatorModule
  init_args:
    model_name: ${trainer.evaluator_model_name}
    location: "global"
    flush_outputs_every_n_steps: 100
    save_outputs: false
    resume_from: ${resume_from}
    max_new_tokens: 100

data:
  class_path: callm.data.UntokenizedEvaluatorDataModule
  init_args:
    batch_size: ${trainer.evaluator_batch_size}
    llm_outputs_path: ${llm_outputs_path}
    previous_eval_csv: ${previous_eval_csv}
    num_workers: ${num_workers}
    resume_from: ${resume_from}
    prompt: callm.prompts.SEMANTIC_EQUIVALENCE_PROMPT_FOR_FREE_ANSWERS

num_workers: 0
llm_outputs_path: null
previous_eval_csv: null
resume_from: null
optimizer: null
lr_scheduler: null
