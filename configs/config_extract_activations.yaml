# configs/config_extract_activations.yaml
seed_everything: true
output_dir: "./activations_cache/qwen_triviaqa"
layer_indices: null
save_dtype: "bfloat16"
resume_from: null

trainer:
  evaluate_correctness: false
  accelerator: "gpu"
  strategy: auto
  devices: [1]
  num_nodes: 1
  deterministic: true
  inference_mode: true
  use_distributed_sampler: true
  default_root_dir: "./activations_cache/qwen_triviaqa"

model:
  class_path: callm.models.LLM
  init_args:
    model_name: Qwen/Qwen3.5-9B
    hf_token: null
    train: false
    return_logits: true
    extractor:
      class_path: callm.extractors.SequencePosteriorExtractor
      init_args:
        model_name: ${model.init_args.model_name}
    save_outputs: false
    flush_outputs_every_n_steps: 100
    max_new_tokens: 200

data:
  class_path: callm.data.TriviaQADataModule
  init_args:
    batch_size: 1
    model_name: ${model.init_args.model_name}
    prompt: callm.prompts.TRANSPARENT_PROMPT_ZERO_SHOT
    max_samples: 5000
    seed: 42
    num_workers: 24
    disable_thinking: true
    split: "train"
    resume_from: ${resume_from}
