# lightning.pytorch==2.6.5
seed_everything: 0
trainer:
  evaluate_correctness: false
  accelerator: gpu
  strategy: auto
  devices: [1]
  max_epochs: 100
  callbacks:
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 5
        mode: min
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        save_top_k: 1
        mode: min
model:
  class_path: callm.models.CachedActivationsConfidenceAugmentedLLM
  init_args:
    model_dim: 4096
    layer_idx: "all"
    num_layers: 33 # Qwen/Qwen3.5-9B has 33 layer hidden states (0 to 32)
    lr: 0.001
data:
  class_path: callm.data.ActivationsDataModule
  init_args:
    activations_dir: /home/eernst/doctorado/callm-dev/activations_cache/qwen_triviaqa/lightning_logs/version_5
    evaluation_csv: /home/eernst/doctorado/callm-dev/activations_cache/qwen_triviaqa/lightning_logs/version_5_evaluation/version_9/evaluation_results.csv
    layer_idx: "all"
    batch_size: 64
    num_workers: 4
    pool_strategy: mean
    train_split: 0.8
    seed: 42
